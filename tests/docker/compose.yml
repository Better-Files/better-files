# Real backing services for the tests that are skipped without them.
#
#   node scripts/test-services.mjs          # start, run the service tests, stop
#   node scripts/test-services.mjs --keep   # leave the containers running afterwards
#
# Or by hand:
#   docker compose -f tests/docker/compose.yml up -d --wait
#   $env:BETTER_FILES_POSTGRES_URL = 'postgres://postgres:better-files-test@localhost:54329/better_files_test'
#   $env:BETTER_FILES_S3_ENDPOINT = 'http://localhost:59000'
#   pnpm exec vitest run tests/conformance tests/integration/real-services.test.ts
#
# The host ports are unusual on purpose, so they don't clash with a PostgreSQL or MinIO the developer already runs.
name: better-files-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: better-files-test
      POSTGRES_DB: better_files_test
    ports:
      - '54329:5432'
    # Test data is disposable: no volume, and durability off for speed.
    command:
      ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d better_files_test']
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: better-files
      MINIO_ROOT_PASSWORD: better-files-test-secret
    ports:
      - '59000:9000'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 30
