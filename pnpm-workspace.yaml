packages:
  - packages/*
  - examples/*
  - apps/*

# Optional peers (framework bindings, native tools) are listed as devDependencies where tests need
# them; the rest are never fetched.
autoInstallPeers: false

overrides:
  # mdast-util-to-markdown 2.2.0 makes Fumadocs 16.15's processed-markdown stringifier recurse forever on bold
  # text (apps/docs build: "Maximum call stack size exceeded"). Better IAM's docs resolve 2.1.2.
  mdast-util-to-markdown: 2.1.2

allowBuilds:
  # Password hashing in better-iam (@better-iam/auth)
  argon2: true
  better-sqlite3: true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@better-iam/a2a@0.3.0'
  - '@better-iam/adapter-libsql@0.3.0'
  - '@better-iam/adapter-postgres@0.3.0'
  - '@better-iam/adapter-sqlite@0.3.0'
  - '@better-iam/auth@0.3.0'
  - '@better-iam/cli@0.3.0'
  - '@better-iam/client@0.3.0'
  - '@better-iam/core@0.3.0'
  - '@better-iam/ldap@0.3.0'
  - '@better-iam/mcp@0.3.0'
  - '@better-iam/middleware@0.3.0'
  - '@better-iam/nestjs@0.3.0'
  - '@better-iam/next@0.3.0'
  - '@better-iam/oauth@0.3.0'
  - '@better-iam/projects@0.3.0'
  - '@better-iam/react-router@0.3.0'
  - '@better-iam/react@0.3.0'
  - '@better-iam/saml@0.3.0'
  - '@better-iam/scim@0.3.0'
  - '@better-iam/server@0.3.0'
  - '@better-iam/svelte@0.3.0'
  - '@better-iam/vue@0.3.0'
  - better-iam@0.3.0
